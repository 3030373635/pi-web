name: Chrome 103 Windows compatibility

on:
  workflow_dispatch:
  push:
    branches: ["codex/chrome-103-compat"]
  pull_request:
    paths:
      - "compat/**"
      - "app/**"
      - "components/**"
      - "hooks/**"
      - "lib/**"
      - "e2e/**"
      - "next.config.ts"
      - "postcss.config.mjs"
      - "package*.json"
      - ".github/workflows/chrome-103-windows.yml"

permissions:
  contents: read

concurrency:
  group: chrome-103-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - name: Lint
        run: node e2e/chrome-103-checks.mjs lint
      - name: Typecheck
        run: node e2e/chrome-103-checks.mjs types
      - name: Test compatibility transforms, APIs and Windows packaging
        run: node e2e/chrome-103-checks.mjs unit
      - name: Build production application
        run: npm run build
      - name: Share production build with independent UI suites
        uses: actions/upload-artifact@v4
        with:
          name: chrome-103-production-build
          include-hidden-files: true
          path: |
            .next/
            !.next/cache/**
            !.next/dev/**
            !.next/**/*.map
          retention-days: 3

  browser:
    needs: build
    name: Windows UI - ${{ matrix.suite }}
    # 没有 Windows 10 托管机；Server 2022 中使用真实 103 和当前 Chromium。
    runs-on: windows-2022
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        suite: [core, settings, content, platform, navigation]
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      E2E_SUITE: ${{ matrix.suite }}
      CHROME_103_NATIVE_PDF: ${{ matrix.suite == 'content' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: chrome-103-production-build
          path: .next
      - name: Install actual Chromium 103 and current Chromium
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path $env:RUNNER_TEMP "chromium-103.zip"
          $directory = Join-Path $env:RUNNER_TEMP "chromium-103"
          # 固定官方对象代次和校验和，不能只伪造浏览器 User-Agent。
          Invoke-WebRequest "https://storage.googleapis.com/chromium-browser-snapshots/Win_x64/1002885/chrome-win.zip?generation=1652399340549393" -OutFile $archive
          if ((Get-FileHash $archive -Algorithm MD5).Hash.ToLowerInvariant() -ne "5a1265254d46356f9f0d146bd5386b32") { throw "Chromium 103 archive checksum mismatch" }
          Expand-Archive $archive -DestinationPath $directory
          "CHROME_103_PATH=$directory\chrome-win\chrome.exe" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          npx playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check production UI in both browsers
        run: node e2e/chrome-103.mjs
      - name: Check Turbopack UI in both browsers
        run: node e2e/chrome-103.mjs
        env:
          E2E_SERVER_MODE: dev
      - name: Upload coverage evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chrome-103-${{ matrix.suite }}-results
          path: test-results/chrome-103/
          if-no-files-found: ignore
          retention-days: 14

  coverage:
    needs: browser
    if: always()
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
      - uses: actions/download-artifact@v4
        with:
          pattern: chrome-103-*-results
          merge-multiple: true
          path: test-results/chrome-103
      - name: Require every suite, browser and build mode to pass
        run: node e2e/chrome-103-coverage.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chrome-103-full-site-coverage
          path: test-results/chrome-103/full-site-coverage.json
          if-no-files-found: ignore
          retention-days: 14
